# Прод-стек финансового помощника на VPS. Живёт в /opt/finance/,
# кладётся туда деплоем finance_helper_back (workflow deploy.yml).
# Значения ${...} — из /opt/finance/.env, который генерируется деплоем
# из GitHub Secrets; вручную не редактировать.
#
# Порты на этом сервере: 80 занят TripOS, 5432 — системным Postgres,
# 8000 — TripOS API. Наружу торчит только 443 (caddy, TLS для Mini App);
# web на 127.0.0.1:8080 и api на 127.0.0.1:8001 — для дебага по SSH.
name: finance

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/sanycska/finance-helper-api:${API_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD}@postgres:5432/finance
      BOT_TOKEN: ${BOT_TOKEN:?}
      WEBAPP_URL: ${WEBAPP_URL:?}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:?}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      BASE_CURRENCY: USD
      EXCLUDED_CATEGORIES: Correction
    # Наружу не торчит; 127.0.0.1 — для дебага через SSH-туннель
    ports:
      - "127.0.0.1:8001:8000"

  bot:
    image: ghcr.io/sanycska/finance-helper-api:${API_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.bot.main
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD}@postgres:5432/finance
      BOT_TOKEN: ${BOT_TOKEN:?}
      WEBAPP_URL: ${WEBAPP_URL:?}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:?}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      BASE_CURRENCY: USD
      EXCLUDED_CATEGORIES: Correction

  web:
    image: ghcr.io/sanycska/finance-helper-web:${WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    # намеренно без depends_on: web — иначе деплой бэка тянул бы образ web,
    # которого при первом запуске ещё нет в GHCR (фронт деплоится позже).
    # Пока web не поднят, caddy отдаёт 502 — это ок.
    ports:
      - "443:443"
    # default обязателен: как только у сервиса появляется явный networks,
    # compose перестаёт подключать его к сети проекта, и reverse_proxy web:3000
    # перестал бы резолвиться. edge — общая сеть для соседних стеков.
    networks:
      - default
      - edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # маршруты соседних стеков; см. import в Caddyfile
      - /opt/edge-routes:/etc/caddy/conf.d:ro
      # выданные сертификаты; без volume каждый рестарт шёл бы за новым
      - caddy_data:/data

# Общая сеть с соседними стеками этой машины; создаётся на сервере руками
# (docker network create edge), поэтому external.
networks:
  edge:
    external: true

volumes:
  pgdata:
  caddy_data:
