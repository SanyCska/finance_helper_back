[project]
name = "finance-helper-back"
version = "0.1.0"
description = "Бэкенд финансового Telegram Mini App"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "aiogram>=3.15",
    "apscheduler>=3.11",
    # база часовых поясов: в slim-образе её может не быть, а zoneinfo
    # без неё не найдёт Europe/Belgrade
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/File/Header в значениях по умолчанию — идиома FastAPI, а не ошибка
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
# в conftest переменные окружения выставляются до импорта приложения
"tests/conftest.py" = ["E402"]
"migrations/versions/*" = ["E501"]

[tool.uv]
package = false
